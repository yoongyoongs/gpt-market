version: "3.4"

services:
  market-mcp:
    image: ${APP_IMAGE:-gpt-market:latest}
    build: .
    container_name: market-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # OCR 图片存储必须落在可写挂载 /data（容器 rootfs 只读）——IaC 固化，NEW-OCR-001
      V3_IMAGE_STORE_DIR: /data/v3-images
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/data

  postgres:
    image: postgres:17-bookworm
    container_name: gpt-market-postgres
    profiles:
      - v3
      - v3-worker
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpt_market}
      POSTGRES_USER: ${POSTGRES_USER:-gpt_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data

  v3-market-worker:
    image: ${APP_IMAGE:-gpt-market:latest}
    build: .
    container_name: gpt-market-v3-worker
    profiles:
      - v3-worker
    restart: unless-stopped
    # P0-04（run_once 资源治理）：Worker 重型 run_once 与 sshd/Nginx/PG/
    # dockerd 共享宿主机，必须关进资源笼子。默认值仅示例——生产值必须按
    # 宿主机规格（nproc/free -h）覆盖，至少预留 25%~40% 给管理面。
    cpus: "${V3_WORKER_CPU_LIMIT:-2.0}"
    mem_limit: "${V3_WORKER_MEMORY_LIMIT:-3g}"
    pids_limit: ${V3_WORKER_PIDS_LIMIT:-512}
    env_file:
      - .env
    environment:
      # 正式调度器（scripts.v3_scheduler）；OCR/盘中间隔等 V3_* 变量经 .env 注入
      V3_IMAGE_STORE_DIR: /data/v3-images
      # P0-05：Worker 独立 DB Pool 预算——run_once 主 Scheduler 与
      # market-data 内部各有一套 Engine，理论上限 10+10；Worker 侧收窄
      # 后即使并存也仅 ~8 连接，API 容器用自己的池不受影响
      V3_DATABASE_POOL_SIZE: "${V3_WORKER_DB_POOL_SIZE:-3}"
      V3_DATABASE_MAX_OVERFLOW: "${V3_WORKER_DB_MAX_OVERFLOW:-1}"
    depends_on:
      postgres:
        condition: service_healthy
    # NEW-OPS-001：仓库 Source of Truth = 正式 Orchestrator 调度器，
    # 不再回落旧 v3_phase2_scheduler（Phase2 market job 已并入主链 market-data Job）
    command: ["sh", "-lc", "alembic upgrade head && python -m scripts.v3_scheduler"]
    healthcheck:
      # 常驻进程存活探测（不做 DB 深检，避免误杀）。
      # 镜像基于 python:3.12-slim 无 procps/pgrep，改用 /proc + grep。
      test: ["CMD-SHELL", "for p in /proc/[0-9]*/cmdline; do grep -qa scripts.v3_scheduler $$p 2>/dev/null && exit 0; done; exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/data

volumes:
  postgres_data:

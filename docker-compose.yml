version: "3.4"

services:
  market-mcp:
    image: ${APP_IMAGE:-gpt-market:latest}
    build: .
    container_name: market-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/data

  postgres:
    image: postgres:17-bookworm
    container_name: gpt-market-postgres
    profiles:
      - v3
      - v3-worker
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpt_market}
      POSTGRES_USER: ${POSTGRES_USER:-gpt_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data

  v3-market-worker:
    image: ${APP_IMAGE:-gpt-market:latest}
    build: .
    container_name: gpt-market-v3-worker
    profiles:
      - v3-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-lc", "alembic upgrade head && python -m scripts.v3_phase2_scheduler"]
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:

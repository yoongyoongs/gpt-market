version: "3.4"

services:
  market-mcp:
    image: ${APP_IMAGE:-gpt-market:latest}
    build: .
    container_name: market-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # OCR 图片存储必须落在可写挂载 /data（容器 rootfs 只读）——IaC 固化，NEW-OCR-001
      V3_IMAGE_STORE_DIR: /data/v3-images
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/data

  postgres:
    image: postgres:17-bookworm
    container_name: gpt-market-postgres
    profiles:
      - v3
      - v3-worker
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpt_market}
      POSTGRES_USER: ${POSTGRES_USER:-gpt_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data

  v3-market-worker:
    image: ${APP_IMAGE:-gpt-market:latest}
    build: .
    container_name: gpt-market-v3-worker
    profiles:
      - v3-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 正式调度器（scripts.v3_scheduler）；OCR/盘中间隔等 V3_* 变量经 .env 注入
      V3_IMAGE_STORE_DIR: /data/v3-images
    depends_on:
      postgres:
        condition: service_healthy
    # NEW-OPS-001：仓库 Source of Truth = 正式 Orchestrator 调度器，
    # 不再回落旧 v3_phase2_scheduler（Phase2 market job 已并入主链 market-data Job）
    command: ["sh", "-lc", "alembic upgrade head && python -m scripts.v3_scheduler"]
    healthcheck:
      # 常驻进程存活探测（不做 DB 深检，避免误杀）
      test: ["CMD", "sh", "-lc", "pgrep -f 'scripts.v3_scheduler' >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/data

volumes:
  postgres_data:
